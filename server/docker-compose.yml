# Reference deployment: API + PostgreSQL + an S3 object store (SeaweedFS),
# plus Toxiproxy for the failure-injection harness (docs/SYNC_DESIGN.md §14).
# For the internet, add docker-compose.public.yml (HTTPS; docs/DEPLOY.md).
#
#   docker compose up -d --build                       API on :8080
#   docker compose --profile harness up -d --build     plus Toxiproxy on 127.0.0.1:18080
#
# Before running anywhere but your own machine: change every password below,
# set SYNC_INVITE_CODES to a secret of your own (the server warns while it is
# the development code), and put TLS in front of the API: that's what
# docker-compose.public.yml does.
#
# The API listens on 127.0.0.1 only; set SYNC_API_BIND=0.0.0.0 to reach it
# from other machines on your network (phones on the same Wi-Fi).
#
# Admin interfaces (Toxiproxy) listen on 127.0.0.1 only:
# Toxiproxy's API has no authentication and can open a route to any service
# on the internal network, including the database.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: change-me-db
      POSTGRES_DB: sync
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync"]
      interval: 5s
      retries: 10

  # S3-compatible object store for the encrypted pieces. (MinIO's images
  # are no longer published; any S3 store works, see SYNC_S3_ENDPOINT.)
  s3:
    image: chrislusf/seaweedfs:3.80
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"sync","credentials":[{"accessKey":"sync","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_SECRET" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024
    environment:
      S3_SECRET: change-me-s3
    volumes: [s3data:/data]

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
      s3: { condition: service_started }
    environment:
      SYNC_DB_URL: postgresql+psycopg://sync:change-me-db@db:5432/sync
      SYNC_S3_ENDPOINT: http://s3:8333
      SYNC_S3_BUCKET: pieces
      SYNC_S3_ACCESS_KEY: sync
      SYNC_S3_SECRET_KEY: change-me-s3
      SYNC_INVITE_CODES: ${SYNC_INVITE_CODES:-dev-invite}
      SYNC_APPEND_ONLY_DEFAULT: "true"
      SYNC_STAGING_DIR: /data/staging
    volumes: [staging:/data]
    ports: ["${SYNC_API_BIND:-127.0.0.1}:8080:8080"]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    profiles: [harness]
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes: ["./harness/toxiproxy.json:/config/toxiproxy.json:ro"]
    ports: ["127.0.0.1:8474:8474", "127.0.0.1:18080:18080"]
    depends_on: [api]

volumes:
  dbdata:
  s3data:
  staging:
