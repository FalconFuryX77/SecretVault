# Reference deployment: API + PostgreSQL + MinIO, plus Toxiproxy for the
# failure-injection harness (docs/SYNC_DESIGN.md §14).
#
#   docker compose up -d --build
#   API direct:            http://localhost:8080
#   API through Toxiproxy: http://localhost:18080  (inject drops/latency here)
#
# Change every password below before running anywhere but your own machine,
# and put TLS in front of the API (e.g. Caddy) for real use.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: change-me-db
      POSTGRES_DB: sync
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: sync
      MINIO_ROOT_PASSWORD: change-me-minio
    volumes: [miniodata:/data]
    ports: ["9001:9001"]

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_started }
    environment:
      SYNC_DB_URL: postgresql+psycopg://sync:change-me-db@db:5432/sync
      SYNC_S3_ENDPOINT: http://minio:9000
      SYNC_S3_BUCKET: pieces
      SYNC_S3_ACCESS_KEY: sync
      SYNC_S3_SECRET_KEY: change-me-minio
      SYNC_INVITE_CODES: ${SYNC_INVITE_CODES:-dev-invite}
      SYNC_APPEND_ONLY_DEFAULT: "true"
      SYNC_STAGING_DIR: /data/staging
    volumes: [staging:/data]
    ports: ["8080:8080"]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes: ["./harness/toxiproxy.json:/config/toxiproxy.json:ro"]
    ports: ["8474:8474", "18080:18080"]
    depends_on: [api]

volumes:
  dbdata:
  miniodata:
  staging:
