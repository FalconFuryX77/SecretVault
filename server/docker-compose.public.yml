# Internet deployment: everything in docker-compose.yml behind Caddy, which
# serves HTTPS on 443 with a certificate it gets and renews by itself.
# The API, database and object store are reachable only inside Docker.
#
#   cp deploy/env.example .env      # then fill it in
#   docker compose -f docker-compose.yml -f docker-compose.public.yml up -d --build
#
# See docs/DEPLOY.md.

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${SYNC_DB_PASSWORD:?set SYNC_DB_PASSWORD in .env}

  s3:
    environment:
      S3_SECRET: ${SYNC_S3_PASSWORD:?set SYNC_S3_PASSWORD in .env}

  api:
    environment:
      SYNC_DB_URL: postgresql+psycopg://sync:${SYNC_DB_PASSWORD}@db:5432/sync
      SYNC_S3_SECRET_KEY: ${SYNC_S3_PASSWORD}
      SYNC_INVITE_CODES: ${SYNC_INVITE_CODES:?set SYNC_INVITE_CODES in .env}
    ports: !override []
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4-alpine
    depends_on: [api]
    restart: unless-stopped
    environment:
      SYNC_DOMAIN: ${SYNC_DOMAIN:?set SYNC_DOMAIN in .env}
    ports:
      - "${SYNC_HTTP_PORT:-80}:80"
      - "${SYNC_HTTPS_PORT:-443}:443"
      - "${SYNC_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
